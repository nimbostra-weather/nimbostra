[project]
name = "nimbostra"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "zarr>=3.0",
    "eccodes>=2.37",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
"scripts/*" = [
    "EXE001", "BLE001", "S110", "B023", "C408",
    "RUF015", "RUF059", "RUF100", "FURB122", "FURB167",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
